services:
  money-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: money-tracker-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgres://postgres:postgres@db:5432/money_tracker
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: money-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: money_tracker
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d money_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
